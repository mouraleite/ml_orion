# Render Blueprint — API FastAPI (plano free)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: erp-ml-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CORS_ORIGINS
        value: https://mlorion.vercel.app,https://erp-ml-six.vercel.app,http://localhost:3000
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SIENGE_SUBDOMAIN
        sync: false
      - key: SIENGE_USER
        sync: false
      - key: SIENGE_PASS
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: CRON_SECRET
        sync: false

  # O web no plano free dorme e o relógio interno não dispara.
  # Cron Job no Render exige plano pago (não existe free). 12:00 e 17:00 UTC = 09:00 e 14:00 Brasília.
  - type: cron
    name: erp-ml-sienge-sync
    runtime: python
    schedule: "0 12,17 * * *"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_daily_sienge_sync.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromService:
          name: erp-ml-api
          type: web
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          name: erp-ml-api
          type: web
          envVarKey: SECRET_KEY
      - key: SIENGE_SUBDOMAIN
        fromService:
          name: erp-ml-api
          type: web
          envVarKey: SIENGE_SUBDOMAIN
      - key: SIENGE_USER
        fromService:
          name: erp-ml-api
          type: web
          envVarKey: SIENGE_USER
      - key: SIENGE_PASS
        fromService:
          name: erp-ml-api
          type: web
          envVarKey: SIENGE_PASS
      - key: REDIS_URL
        value: redis://localhost:6379/0
